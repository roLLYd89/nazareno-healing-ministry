<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Missionaries of Nazareno Healing Ministry</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
</head>

<body>

    <div class="container">
            <div class="texts">
                <div class="text1">Missionaries of Nazareno Healing Ministry, Inc.</div>
                <div class="text2">"Welcome to our Mission"</div>
                <div class="text3">Faith. Healing. Love. Service.</div>
            </div>

            <div class="login-panel">
               
                <img class="logo" src="images/logo.png" alt="logo of Nazareno Heling Ministry">         
                
                <div class="logon">Log On</div>
                    <input type="usernamebox" id="usernameInput" placeholder="Email or Username">  
                    <input type="passwordbox" id="passwordInput" placeholder="Password">
                    <button type="submit" id="loginBtn">Log on</button>
                            
                    <div class="remember-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                </div>
                    <div class="signup-container">
                        <div class="signup-notice"> No account?</div>
                        <button type="button" id="signupBtn">Sign Up</button>
                    </div>
            </div>                                 
    </div>
            

</body>
</html>
